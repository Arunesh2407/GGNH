server:
  port: 0

app:
  firebase:
    enabled: false
  cors:
    allowed-origins: http://localhost:5173,http://localhost:3000,http://localhost:8081
  rate-limit:
    enabled: true
    appointments-per-minute: 100
    auth-per-minute: 100
    trust-proxy-headers: false
  bootstrap:
    first-owner:
      enabled: false
      secret: ""

spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: false
