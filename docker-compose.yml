services:
  postgres:
    image: postgres:16-alpine
    container_name: ggnh-postgres
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: ${DB_NAME:-ggnh_verify_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-ggnh_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:

